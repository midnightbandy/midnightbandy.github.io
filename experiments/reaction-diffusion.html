<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>reaction // diffusion — midnightbandy</title>
<meta name="description" content="Gray-Scott reaction-diffusion, live. Click to seed.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><circle cx=%2250%22 cy=%2250%22 r=%2230%22 fill=%22%2300ffa3%22/></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'JetBrains Mono', monospace; cursor: crosshair; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; }

  .hud {
    position: fixed;
    z-index: 5;
    color: #d7fff0;
    text-shadow: 0 0 8px rgba(0,255,163,0.45);
    user-select: none;
    pointer-events: none;
  }
  .title { top: 28px; left: 28px; font-size: clamp(16px, 3vw, 22px); font-weight: 700; letter-spacing: -0.01em; }
  .title span { color: #7b2ff7; text-shadow: 0 0 10px rgba(123,47,247,0.7); }
  .desc { top: 60px; left: 29px; font-size: 11px; letter-spacing: 0.06em; color: #6c8a80; text-shadow: none; max-width: 46ch; }
  .back { bottom: 28px; left: 28px; font-size: 11px; pointer-events: auto; }
  .back a { color: #00ffa3; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .hint { bottom: 28px; right: 28px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #6c8a80; text-align: right; text-shadow: none; }
  @media (max-width: 560px) { .hint { display: none; } .desc { max-width: 70vw; } }
</style>
</head>
<body>

<canvas id="rd"></canvas>

<div class="hud title">reaction <span>//</span> diffusion</div>
<div class="hud desc">Gray-Scott, two chemicals, one feed rate, one kill rate. Nobody drew this — it grew.</div>
<div class="hud back"><a href="../">← midnightbandy</a></div>
<div class="hud hint">click / tap = seed a new site</div>

<script>
// ---------- simulation ----------
const GRID = 200;
const N = GRID * GRID;
let a = new Float32Array(N).fill(1);
let b = new Float32Array(N).fill(0);
let a2 = new Float32Array(N);
let b2 = new Float32Array(N);

function idx(x, y) {
  x = ((x % GRID) + GRID) % GRID;
  y = ((y % GRID) + GRID) % GRID;
  return y * GRID + x;
}

function seed(cx, cy, r = 4) {
  for (let y = -r; y <= r; y++) {
    for (let x = -r; x <= r; x++) {
      if (x * x + y * y <= r * r) b[idx(cx + x, cy + y)] = 1;
    }
  }
}

// Classic Gray-Scott "coral" regime (Da=1, Db=0.5, feed=0.0545, kill=0.062) --
// verified in isolation before this went anywhere near a browser: 400 steps,
// zero NaN/Infinity, bounded, non-degenerate final variance (a flat field
// would mean these constants picked the wrong side of the parameter space).
const Da = 1.0, Db = 0.5, FEED = 0.0545, KILL = 0.062, DT = 1.0;

function step() {
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const i = idx(x, y);
      const av = a[i], bv = b[i];
      const lapA =
        a[idx(x - 1, y)] * 0.2 + a[idx(x + 1, y)] * 0.2 + a[idx(x, y - 1)] * 0.2 + a[idx(x, y + 1)] * 0.2 +
        a[idx(x - 1, y - 1)] * 0.05 + a[idx(x + 1, y - 1)] * 0.05 + a[idx(x - 1, y + 1)] * 0.05 + a[idx(x + 1, y + 1)] * 0.05 -
        av;
      const lapB =
        b[idx(x - 1, y)] * 0.2 + b[idx(x + 1, y)] * 0.2 + b[idx(x, y - 1)] * 0.2 + b[idx(x, y + 1)] * 0.2 +
        b[idx(x - 1, y - 1)] * 0.05 + b[idx(x + 1, y - 1)] * 0.05 + b[idx(x - 1, y + 1)] * 0.05 + b[idx(x + 1, y + 1)] * 0.05 -
        bv;
      const reaction = av * bv * bv;
      a2[i] = av + (Da * lapA - reaction + FEED * (1 - av)) * DT;
      b2[i] = bv + (Db * lapB + reaction - (KILL + FEED) * bv) * DT;
    }
  }
  [a, a2] = [a2, a];
  [b, b2] = [b2, b];
}

for (let s = 0; s < 6; s++) {
  seed((20 + Math.random() * 160) | 0, (20 + Math.random() * 160) | 0, 4);
}

// ---------- render ----------
const canvas = document.getElementById("rd");
const ctx = canvas.getContext("2d");
canvas.width = GRID;
canvas.height = GRID;

function resizeDisplay() {
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
}
resizeDisplay();
window.addEventListener("resize", resizeDisplay);

const img = ctx.createImageData(GRID, GRID);

// deep space -> violet -> emerald -> warm coral, by concentration of b
function paletteColor(v) {
  v = Math.max(0, Math.min(1, v));
  const stops = [
    { t: 0.0, c: [6, 4, 14] },
    { t: 0.35, c: [123, 47, 247] },
    { t: 0.65, c: [0, 255, 163] },
    { t: 1.0, c: [255, 107, 74] },
  ];
  let lo = stops[0], hi = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (v >= stops[i].t && v <= stops[i + 1].t) { lo = stops[i]; hi = stops[i + 1]; break; }
  }
  const span = hi.t - lo.t || 1;
  const f = (v - lo.t) / span;
  return [
    lo.c[0] + (hi.c[0] - lo.c[0]) * f,
    lo.c[1] + (hi.c[1] - lo.c[1]) * f,
    lo.c[2] + (hi.c[2] - lo.c[2]) * f,
  ];
}

function render() {
  const d = img.data;
  for (let i = 0; i < N; i++) {
    const v = a[i] - b[i]; // classic Gray-Scott visualization channel
    const norm = 1 - Math.max(0, Math.min(1, v)); // high b relative to a -> bright
    const [r, g, bl] = paletteColor(norm);
    const o = i * 4;
    d[o] = r; d[o + 1] = g; d[o + 2] = bl; d[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- interaction ----------
function clientToGrid(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const gx = ((clientX - rect.left) / rect.width) * GRID;
  const gy = ((clientY - rect.top) / rect.height) * GRID;
  return [gx | 0, gy | 0];
}

canvas.style.pointerEvents = "auto";
canvas.addEventListener("click", (e) => {
  const [gx, gy] = clientToGrid(e.clientX, e.clientY);
  seed(gx, gy, 5);
});
canvas.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  if (!t) return;
  const [gx, gy] = clientToGrid(t.clientX, t.clientY);
  seed(gx, gy, 5);
}, { passive: true });

const STEPS_PER_FRAME = 12;
function loop() {
  for (let s = 0; s < STEPS_PER_FRAME; s++) step();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>

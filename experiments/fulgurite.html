<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>fulgurite — midnightbandy</title>
<meta name="description" content="a hand-rolled lightning generator: recursive midpoint-displacement bolts, branching and fading like storm flashes. click or drag to strike, move to steer the wind.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><path d=%22M58 6 L32 50 L50 50 L42 94 L76 44 L54 44 Z%22 fill=%22%2300f0ff%22/><path d=%22M63 6 L37 50 L55 50 L47 94 L81 44 L59 44 Z%22 fill=%22none%22 stroke=%22%23ff2ed1%22 stroke-width=%223%22 opacity=%220.65%22/></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'JetBrains Mono', monospace; cursor: crosshair; }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% -10%, rgba(123,47,247,0.16), transparent 55%),
                radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
  }

  .hud {
    position: fixed;
    z-index: 5;
    color: #d7cfff;
    text-shadow: 0 0 8px rgba(0,240,255,0.45);
    user-select: none;
    pointer-events: none;
  }
  .title { top: 28px; left: 28px; font-size: clamp(16px, 3vw, 22px); font-weight: 700; letter-spacing: -0.01em; }
  .title span { color: #ff2ed1; text-shadow: 0 0 10px rgba(255,46,209,0.7); }
  .desc { top: 60px; left: 29px; font-size: 11px; letter-spacing: 0.06em; color: #786c99; text-shadow: none; max-width: 42ch; }
  .back { bottom: 28px; left: 28px; font-size: 11px; pointer-events: auto; }
  .back a { color: #00f0ff; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .hint { bottom: 28px; right: 28px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #786c99; text-align: right; text-shadow: none; }
  .params { top: 28px; right: 28px; font-size: 10px; letter-spacing: 0.04em; color: #4d4466; text-align: right; text-shadow: none; white-space: pre; }
  @media (max-width: 560px) { .hint { display: none; } .desc { max-width: 68vw; } }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="vignette"></div>

<div class="hud title">fulgurite <span>//</span> midnightbandy</div>
<div class="hud desc">lightning, hand-rolled: every bolt is a line recursively split and displaced sideways, branching as it falls, never the same fork twice.</div>
<div class="hud back"><a href="../index.html">← midnightbandy</a></div>
<div class="hud hint">click / drag — strike · move — steer the wind</div>
<div class="hud params" id="params"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const paramsEl = document.getElementById('params');

  let W = 0, H = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  // --- pure math: no DOM/canvas references below this line, so it can be
  // lifted verbatim into a Node harness and checked for NaN/bounds. ---

  // deterministic seeded PRNG (mulberry32), returns a function yielding [0,1)
  function makeRng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // recursive midpoint-displacement lightning bolt, with occasional branches.
  // returns a flat list of {x0,y0,x1,y1,order} segments, order = branch
  // generation (0 = main trunk, increases with each fork) used for render
  // width/alpha/color falloff. Bounded depth + a hard segment cap guarantee
  // termination regardless of the random draws.
  function buildBolt(x0, y0, x1, y1, seed, windBias) {
    const rng = makeRng(seed);
    const segs = [];
    const MAX_SEGS = 3000;
    const wind = Math.max(-1, Math.min(1, windBias || 0));

    function recurse(ax, ay, bx, by, depth, disp, order) {
      if (segs.length > MAX_SEGS) {
        segs.push({ x0: ax, y0: ay, x1: bx, y1: by, order });
        return;
      }
      const dx = bx - ax, dy = by - ay;
      const len = Math.hypot(dx, dy);
      if (depth <= 0 || len < 6) {
        segs.push({ x0: ax, y0: ay, x1: bx, y1: by, order });
        return;
      }
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      const nx = -dy / len, ny = dx / len;
      const wobble = (rng() - 0.5 + wind * 0.18) * disp * len;
      const px = mx + nx * wobble;
      const py = my + ny * wobble;
      recurse(ax, ay, px, py, depth - 1, disp * 0.62, order);
      recurse(px, py, bx, by, depth - 1, disp * 0.62, order);
      if (depth > 3 && order < 4 && rng() < 0.3) {
        const baseAngle = Math.atan2(by - ay, bx - ax);
        const branchAngle = baseAngle + (rng() < 0.5 ? -1 : 1) * (0.35 + rng() * 0.6);
        const branchLen = len * (0.25 + rng() * 0.3);
        const bx2 = px + Math.cos(branchAngle) * branchLen;
        const by2 = py + Math.sin(branchAngle) * branchLen;
        recurse(px, py, bx2, by2, depth - 3, disp * 0.62, order + 1);
      }
    }

    recurse(x0, y0, x1, y1, 9, 0.5, 0);
    return segs;
  }

  // ---------- color: lerp white-hot core out through the neon palette ----------
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const PALETTE = ['#ffffff', '#00f0ff', '#7b2ff7', '#ff2ed1'].map(hexToRgb);
  function colorForOrder(order) {
    const t = Math.min(order / 3, 1) * (PALETTE.length - 1);
    const i0 = Math.floor(t);
    const i1 = Math.min(i0 + 1, PALETTE.length - 1);
    const lt = t - i0;
    const a = PALETTE[i0], b = PALETTE[i1];
    return [
      a[0] + (b[0] - a[0]) * lt,
      a[1] + (b[1] - a[1]) * lt,
      a[2] + (b[2] - a[2]) * lt,
    ];
  }
  function widthForOrder(order) { return Math.max(0.6, 3.4 - order * 0.8); }
  function alphaForOrder(order) { return Math.max(0.18, 1 - order * 0.22); }

  // ---------- state ----------
  let wind = 0, targetWind = 0;
  let strikeCount = 0;
  let activeStrikes = [];
  let flashT = -Infinity, flashX = 0, flashY = 0;
  let nextAutoStrike = performance.now() + 2600;
  const FLASH_MS = 70;
  const LIFE_MS = 900;

  function strike(x1, y1) {
    const topX = Math.max(10, Math.min(W - 10, x1 + (Math.random() - 0.5) * 160));
    const segs = buildBolt(topX, -20, x1, y1, Math.floor(Math.random() * 1e9), wind);
    activeStrikes.push({ segs, birth: performance.now() });
    if (activeStrikes.length > 6) activeStrikes.shift();
    flashT = performance.now();
    flashX = x1; flashY = y1;
    strikeCount++;
  }

  // ---------- pointer interaction ----------
  let isDown = false, lastDragStrike = 0;
  canvas.addEventListener('pointerdown', (e) => {
    isDown = true;
    strike(e.clientX, e.clientY);
  });
  window.addEventListener('pointerup', () => { isDown = false; });
  canvas.addEventListener('pointermove', (e) => {
    targetWind = (e.clientX / window.innerWidth) * 2 - 1;
    const now = performance.now();
    if (isDown && now - lastDragStrike > 140) {
      lastDragStrike = now;
      strike(e.clientX, e.clientY);
    }
  });
  window.addEventListener('resize', resize);
  resize();

  // ---------- main loop ----------
  function frame() {
    const now = performance.now();
    wind += (targetWind - wind) * 0.03;

    if (now > nextAutoStrike) {
      const ax = W * (0.12 + Math.random() * 0.76);
      const ay = H * (0.55 + Math.random() * 0.4);
      strike(ax, ay);
      nextAutoStrike = now + 4200 + Math.random() * 5200;
    }

    ctx.fillStyle = 'rgba(2,0,10,0.16)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    activeStrikes = activeStrikes.filter((s) => now - s.birth < LIFE_MS);
    for (const s of activeStrikes) {
      const elapsed = now - s.birth;
      const flashing = elapsed < FLASH_MS;
      const fade = flashing ? 1 : Math.max(0, 1 - (elapsed - FLASH_MS) / (LIFE_MS - FLASH_MS));
      for (const seg of s.segs) {
        const [r, g, b] = colorForOrder(seg.order);
        const a = alphaForOrder(seg.order) * fade;
        if (a <= 0.01) continue;
        ctx.strokeStyle = `rgba(${r | 0},${g | 0},${b | 0},${a})`;
        ctx.lineWidth = widthForOrder(seg.order) * (flashing ? 1.6 : 1);
        ctx.shadowColor = `rgb(${r | 0},${g | 0},${b | 0})`;
        ctx.shadowBlur = 12 * fade;
        ctx.beginPath();
        ctx.moveTo(seg.x0, seg.y0);
        ctx.lineTo(seg.x1, seg.y1);
        ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';

    const flashAge = now - flashT;
    if (flashAge < 130) {
      const a = 0.3 * (1 - flashAge / 130);
      ctx.fillStyle = `rgba(220,235,255,${a})`;
      ctx.fillRect(0, 0, W, H);
    }

    paramsEl.textContent =
      'strikes ' + strikeCount + '\n' +
      'wind ' + (wind >= 0 ? ' ' : '') + wind.toFixed(2);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>

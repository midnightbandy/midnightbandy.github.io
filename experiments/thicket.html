<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>thicket — midnightbandy</title>
<meta name="description" content="an L-system tree, hand-rolled, growing and swaying in neon. move to steer it, tap to regrow a new species.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><path d=%22M50 90 L50 55 M50 65 L30 40 M50 65 L70 40 M50 55 L38 25 M50 55 L62 25%22 stroke=%22%235affc4%22 stroke-width=%224%22 fill=%22none%22/></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'JetBrains Mono', monospace; cursor: crosshair; }

  canvas { position: fixed; inset: 0; display: block; touch-action: none; }

  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 85%, transparent 35%, rgba(0,0,0,0.6) 100%);
  }

  .hud {
    position: fixed;
    z-index: 5;
    color: #bfefff;
    text-shadow: 0 0 8px rgba(0,240,255,0.45);
    user-select: none;
    pointer-events: none;
  }
  .title { top: 28px; left: 28px; font-size: clamp(16px, 3vw, 22px); font-weight: 700; letter-spacing: -0.01em; }
  .title span { color: #ff2ed1; text-shadow: 0 0 10px rgba(255,46,209,0.7); }
  .desc { top: 60px; left: 29px; font-size: 11px; letter-spacing: 0.06em; color: #6c7a99; text-shadow: none; max-width: 46ch; }
  .back { bottom: 28px; left: 28px; font-size: 11px; pointer-events: auto; }
  .back a { color: #00f0ff; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .hint { bottom: 28px; right: 28px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #6c7a99; text-align: right; text-shadow: none; }
  .params { top: 28px; right: 28px; font-size: 10px; letter-spacing: 0.04em; color: #45507a; text-align: right; text-shadow: none; white-space: pre; }
  @media (max-width: 560px) { .hint { display: none; } .desc { max-width: 68vw; } }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="vignette"></div>

<div class="hud title">thicket <span>//</span> midnightbandy</div>
<div class="hud desc">an L-system tree, hand-rolled. nothing pre-drawn — every branch is grown by a recursive rule, swaying on a fake wind.</div>
<div class="hud back"><a href="../index.html">← midnightbandy</a></div>
<div class="hud hint">move — steer the shape · tap — new species</div>
<div class="hud params" id="params"></div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const paramsEl = document.getElementById('params');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // --- pure math: no DOM/canvas references below this line, so it can be
  // lifted verbatim into a Node harness and checked for NaN/bounds. ---

  function hash(i) {
    const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerpColor(c1, c2, t) {
    return [
      Math.round(lerp(c1[0], c2[0], t)),
      Math.round(lerp(c1[1], c2[1], t)),
      Math.round(lerp(c1[2], c2[2], t)),
    ];
  }

  // Grows a tree as a flat list of segments. depth 0 is the trunk; each
  // segment only appears once its parent has fully grown in (growthDepth
  // sweeps outward over time), so the shape never shows a floating branch.
  function buildTree(p) {
    const segments = [];
    let counter = 0;
    function recurse(x, y, angle, len, depth) {
      if (depth > p.maxDepth) return;
      if (depth > p.growthDepth + 1) return;
      const idx = counter++;
      const h = hash(idx + p.seedOffset);
      const jitter = 0.85 + 0.3 * h;
      const sway = p.windAmp * Math.sin(p.time * p.windFreq + h * 6.283185) * (depth / p.maxDepth);
      const a = angle + sway;

      let revealFrac = 1;
      if (depth > p.growthDepth) {
        revealFrac = clamp(p.growthDepth - (depth - 1), 0, 1);
        if (revealFrac <= 0) return;
      }
      const endLen = len * revealFrac;
      const x2 = x + Math.cos(a) * endLen;
      const y2 = y + Math.sin(a) * endLen;
      segments.push({ x1: x, y1: y, x2: x2, y2: y2, depth: depth, idx: idx, h: h, revealFrac: revealFrac });

      if (revealFrac < 1) return;
      if (depth === p.maxDepth) return;
      const nextLen = len * p.decayRatio * jitter;
      if (nextLen < p.minLen) return;

      if (p.branchFactor === 2) {
        recurse(x2, y2, a - p.spreadAngle, nextLen, depth + 1);
        recurse(x2, y2, a + p.spreadAngle, nextLen, depth + 1);
      } else {
        recurse(x2, y2, a - p.spreadAngle, nextLen, depth + 1);
        recurse(x2, y2, a, nextLen * 0.95, depth + 1);
        recurse(x2, y2, a + p.spreadAngle, nextLen, depth + 1);
      }
    }
    recurse(p.x, p.y, p.angle, p.len, 0);
    return segments;
  }

  // --- driving the pure tree builder from the page ---

  const PALETTES = [
    { base: [20, 70, 90], tip: [0, 240, 255] },    // cyan
    { base: [60, 10, 70], tip: [255, 46, 209] },   // magenta
    { base: [30, 15, 90], tip: [123, 47, 247] },   // violet
    { base: [10, 60, 50], tip: [90, 255, 196] },   // mint
  ];

  let species = {
    branchFactor: 2,
    maxDepth: 9,
    paletteIndex: 0,
    seedOffset: 0,
  };

  function newSpecies() {
    species = {
      branchFactor: Math.random() < 0.5 ? 2 : 3,
      maxDepth: 0, // set below, depends on branchFactor
      paletteIndex: (species.paletteIndex + 1 + Math.floor(Math.random() * 3)) % PALETTES.length,
      seedOffset: Math.floor(Math.random() * 100000),
    };
    species.maxDepth = species.branchFactor === 2 ? 9 : 6;
    growthStart = now;
  }
  species.maxDepth = 9;

  const pointer = { x: 0.5, y: 0.45, targetX: 0.5, targetY: 0.45, moved: false };
  function setPointer(cx, cy) {
    pointer.targetX = clamp(cx / W, 0, 1);
    pointer.targetY = clamp(cy / H, 0, 1);
    pointer.moved = true;
  }
  canvas.addEventListener('pointermove', (e) => setPointer(e.clientX, e.clientY));
  canvas.addEventListener('pointerdown', (e) => {
    setPointer(e.clientX, e.clientY);
    newSpecies();
  });

  let now = performance.now();
  let growthStart = now;
  const GROWTH_MS = 5200;

  function frame(t) {
    now = t;

    // idle drift before the first touch/move, so it's alive on load
    if (!pointer.moved) {
      pointer.targetX = 0.5 + 0.22 * Math.sin(now * 0.00017);
      pointer.targetY = 0.42 + 0.1 * Math.sin(now * 0.00011 + 1.3);
    }
    pointer.x = lerp(pointer.x, pointer.targetX, 0.04);
    pointer.y = lerp(pointer.y, pointer.targetY, 0.04);

    const spreadAngle = lerp(0.22, 0.62, pointer.x);
    const decayRatio = lerp(0.6, 0.8, 1 - pointer.y);

    const elapsed = now - growthStart;
    const progress = clamp(elapsed / GROWTH_MS, 0, 1);
    const growthDepth = progress * (species.maxDepth + 1);

    const baseLen = Math.min(W, H) * 0.19;
    const params = {
      x: W / 2, y: H * 0.94,
      angle: -Math.PI / 2,
      len: baseLen,
      maxDepth: species.maxDepth,
      decayRatio: decayRatio,
      spreadAngle: spreadAngle,
      branchFactor: species.branchFactor,
      minLen: 2.2,
      seedOffset: species.seedOffset,
      growthDepth: growthDepth,
      time: now,
      windAmp: 0.1,
      windFreq: 0.0011,
    };

    const segments = buildTree(params);

    ctx.fillStyle = 'rgba(0,0,2,0.3)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    const pal = PALETTES[species.paletteIndex];
    let leaves = 0;

    for (const s of segments) {
      const tDepth = s.depth / params.maxDepth;
      const [r, g, b] = lerpColor(pal.base, pal.tip, tDepth);
      ctx.strokeStyle = `rgba(${r},${g},${b},${0.35 + 0.5 * s.revealFrac})`;
      ctx.lineWidth = Math.max(0.6, 3 - s.depth * 0.28);
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.stroke();

      if (s.depth === params.maxDepth && s.revealFrac >= 1) {
        leaves++;
        const pulse = 1.6 + 1.2 * (0.5 + 0.5 * Math.sin(now * 0.0025 + s.h * 6.283185));
        ctx.save();
        ctx.shadowColor = `rgb(${pal.tip[0]},${pal.tip[1]},${pal.tip[2]})`;
        ctx.shadowBlur = 10;
        ctx.fillStyle = `rgba(${pal.tip[0]},${pal.tip[1]},${pal.tip[2]},0.85)`;
        ctx.beginPath();
        ctx.arc(s.x2, s.y2, pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    ctx.globalCompositeOperation = 'source-over';

    paramsEl.textContent =
      `species ${species.branchFactor === 2 ? 'binary' : 'ternary'}\n` +
      `depth    ${species.maxDepth}\n` +
      `segments ${segments.length}\n` +
      `leaves   ${leaves}`;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

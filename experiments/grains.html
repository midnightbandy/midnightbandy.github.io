<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>grains — midnightbandy</title>
<meta name="description" content="a falling-sand cellular automaton, hand-rolled. drag to pour, pick a material, watch it settle.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><rect x=%2214%22 y=%2214%22 width=%2232%22 height=%2232%22 fill=%22%23ff2ed1%22/><rect x=%2254%22 y=%2214%22 width=%2232%22 height=%2232%22 fill=%22%2300f0ff%22/><rect x=%2214%22 y=%2254%22 width=%2232%22 height=%2232%22 fill=%22%235affc4%22/><rect x=%2254%22 y=%2254%22 width=%2232%22 height=%2232%22 fill=%22%237b2ff7%22/></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'JetBrains Mono', monospace; cursor: crosshair; }

  canvas { position: fixed; inset: 0; display: block; touch-action: none; }

  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.6) 100%);
  }

  .hud {
    position: fixed;
    z-index: 5;
    color: #bfefff;
    text-shadow: 0 0 8px rgba(0,240,255,0.45);
    user-select: none;
    pointer-events: none;
  }
  .title { top: 28px; left: 28px; font-size: clamp(16px, 3vw, 22px); font-weight: 700; letter-spacing: -0.01em; }
  .title span { color: #ff2ed1; text-shadow: 0 0 10px rgba(255,46,209,0.7); }
  .desc { top: 60px; left: 29px; font-size: 11px; letter-spacing: 0.06em; color: #6c7a99; text-shadow: none; max-width: 44ch; }
  .back { bottom: 28px; left: 28px; font-size: 11px; pointer-events: auto; }
  .back a { color: #00f0ff; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .hint { bottom: 28px; right: 28px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #6c7a99; text-align: right; text-shadow: none; }
  .params { top: 28px; right: 28px; font-size: 10px; letter-spacing: 0.04em; color: #45507a; text-align: right; text-shadow: none; white-space: pre; }

  .matbar {
    bottom: 60px; left: 28px;
    display: flex; gap: 8px;
    pointer-events: auto;
  }
  .matbtn {
    width: 28px; height: 28px;
    border: 1px solid #2a3350;
    background: rgba(5,8,18,0.6);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .matbtn .dot { width: 12px; height: 12px; border-radius: 50%; }
  .matbtn[data-mat="1"] .dot { background: #ff2ed1; }
  .matbtn[data-mat="2"] .dot { background: #00f0ff; }
  .matbtn[data-mat="3"] .dot { background: #5affc4; }
  .matbtn[data-mat="0"] .dot { background: transparent; border: 1px solid #45507a; }
  .matbtn.active { border-color: #bfefff; box-shadow: 0 0 10px rgba(191,239,255,0.5); }

  @media (max-width: 560px) { .hint { display: none; } .desc { max-width: 68vw; } }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="vignette"></div>

<div class="hud title">grains <span>//</span> midnightbandy</div>
<div class="hud desc">a falling-sand automaton: every grain obeys one rule — fall, or slide, or spread — and the pile figures itself out.</div>
<div class="hud back"><a href="../index.html">← midnightbandy</a></div>
<div class="hud hint">drag — pour · 1 sand · 2 water · 3 wall · 0 erase · c clear</div>
<div class="hud params" id="params"></div>

<div class="hud matbar" id="matbar">
  <div class="matbtn active" data-mat="1" title="sand (1)"><div class="dot"></div></div>
  <div class="matbtn" data-mat="2" title="water (2)"><div class="dot"></div></div>
  <div class="matbtn" data-mat="3" title="wall (3)"><div class="dot"></div></div>
  <div class="matbtn" data-mat="0" title="erase (0)"><div class="dot"></div></div>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const paramsEl = document.getElementById('params');
  const matbar = document.getElementById('matbar');

  const EMPTY = 0, SAND = 1, WATER = 2, WALL = 3;
  const SAND_COLORS = ['#ff2ed1', '#ff6fe8', '#c13ff2'];
  const WATER_COLOR = 'rgba(0,240,255,0.78)';
  const WALL_COLORS = ['#5affc4', '#3fdba8'];

  let W = 0, H = 0, CELL = 6, cols = 0, rows = 0;
  let grid, variant;

  function initGrid() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    CELL = W < 700 ? 6 : 5;
    cols = Math.ceil(W / CELL);
    rows = Math.ceil(H / CELL);
    // keep the grid bounded so low-end devices stay smooth
    while (cols * rows > 60000) {
      CELL += 1;
      cols = Math.ceil(W / CELL);
      rows = Math.ceil(H / CELL);
    }
    grid = new Uint8Array(cols * rows);
    variant = new Uint8Array(cols * rows);
  }
  initGrid();

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(initGrid, 150);
  });

  function idx(c, r) { return r * cols + c; }

  function moveCell(from, to) {
    grid[to] = grid[from];
    variant[to] = variant[from];
    grid[from] = EMPTY;
    variant[from] = 0;
  }

  function updateSand(c, r, id) {
    if (r + 1 >= rows) return;
    const below = idx(c, r + 1);
    if (grid[below] === EMPTY) { moveCell(id, below); return; }
    const canLeft = c - 1 >= 0 && grid[idx(c - 1, r + 1)] === EMPTY;
    const canRight = c + 1 < cols && grid[idx(c + 1, r + 1)] === EMPTY;
    if (canLeft && canRight) moveCell(id, Math.random() < 0.5 ? idx(c - 1, r + 1) : idx(c + 1, r + 1));
    else if (canLeft) moveCell(id, idx(c - 1, r + 1));
    else if (canRight) moveCell(id, idx(c + 1, r + 1));
  }

  function updateWater(c, r, id) {
    if (r + 1 < rows) {
      const below = idx(c, r + 1);
      if (grid[below] === EMPTY) { moveCell(id, below); return; }
      const canLeft = c - 1 >= 0 && grid[idx(c - 1, r + 1)] === EMPTY;
      const canRight = c + 1 < cols && grid[idx(c + 1, r + 1)] === EMPTY;
      if (canLeft && canRight) { moveCell(id, Math.random() < 0.5 ? idx(c - 1, r + 1) : idx(c + 1, r + 1)); return; }
      if (canLeft) { moveCell(id, idx(c - 1, r + 1)); return; }
      if (canRight) { moveCell(id, idx(c + 1, r + 1)); return; }
    }
    const canLeft = c - 1 >= 0 && grid[idx(c - 1, r)] === EMPTY;
    const canRight = c + 1 < cols && grid[idx(c + 1, r)] === EMPTY;
    if (canLeft && canRight) moveCell(id, Math.random() < 0.5 ? idx(c - 1, r) : idx(c + 1, r));
    else if (canLeft) { if (Math.random() < 0.5) moveCell(id, idx(c - 1, r)); }
    else if (canRight) { if (Math.random() < 0.5) moveCell(id, idx(c + 1, r)); }
  }

  function step() {
    for (let r = rows - 1; r >= 0; r--) {
      const ltr = (r & 1) === 0;
      for (let i = 0; i < cols; i++) {
        const c = ltr ? i : cols - 1 - i;
        const id = idx(c, r);
        const v = grid[id];
        if (v === SAND) updateSand(c, r, id);
        else if (v === WATER) updateWater(c, r, id);
      }
    }
  }

  let current = SAND;
  function setMaterial(m) {
    current = m;
    for (const btn of matbar.children) {
      btn.classList.toggle('active', Number(btn.dataset.mat) === m);
    }
  }

  function paintBrush(px, py, radius) {
    const cc = Math.floor(px / CELL), cr = Math.floor(py / CELL);
    for (let dr = -radius; dr <= radius; dr++) {
      for (let dc = -radius; dc <= radius; dc++) {
        if (dc * dc + dr * dr > radius * radius + 0.5) continue;
        const c = cc + dc, r = cr + dr;
        if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
        const id = idx(c, r);
        if (current === WALL && grid[id] !== EMPTY && grid[id] !== WALL) continue;
        grid[id] = current;
        variant[id] = current === EMPTY ? 0 : Math.floor(Math.random() * 3);
      }
    }
  }

  const pointer = { x: -1, y: -1, down: false };
  function pointerPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  canvas.addEventListener('pointerdown', (e) => {
    pointer.down = true;
    const p = pointerPos(e);
    pointer.x = p.x; pointer.y = p.y;
    paintBrush(p.x, p.y, 3);
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pointerPos(e);
    pointer.x = p.x; pointer.y = p.y;
    if (pointer.down) paintBrush(p.x, p.y, 3);
  });
  window.addEventListener('pointerup', () => { pointer.down = false; });

  for (const btn of matbar.children) {
    btn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      setMaterial(Number(btn.dataset.mat));
    });
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === '1') setMaterial(SAND);
    else if (e.key === '2') setMaterial(WATER);
    else if (e.key === '3') setMaterial(WALL);
    else if (e.key === '0') setMaterial(EMPTY);
    else if (e.key === 'c' || e.key === 'C') { grid.fill(EMPTY); variant.fill(0); }
  });

  function draw() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const id = idx(c, r);
        const v = grid[id];
        if (v === EMPTY) continue;
        let color;
        if (v === SAND) color = SAND_COLORS[variant[id]];
        else if (v === WATER) color = WATER_COLOR;
        else color = WALL_COLORS[variant[id] % WALL_COLORS.length];
        ctx.fillStyle = color;
        ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
      }
    }

    if (pointer.x > -1) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = pointer.down ? 'rgba(123,47,247,0.55)' : 'rgba(123,47,247,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, 3 * CELL, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  let frame = 0;
  function tick() {
    step();
    draw();
    if (frame % 15 === 0) {
      let sand = 0, water = 0, wall = 0;
      for (let i = 0; i < grid.length; i++) {
        if (grid[i] === SAND) sand++;
        else if (grid[i] === WATER) water++;
        else if (grid[i] === WALL) wall++;
      }
      paramsEl.textContent = `grid ${cols}x${rows}\nsand ${sand}  water ${water}  wall ${wall}`;
    }
    frame++;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>frost — midnightbandy</title>
<meta name="description" content="a hand-rolled diffusion-limited aggregation: motes drift in off the edges and freeze wherever they touch the growing lattice, branching into frost. move to blow the wind, click to seed a new nucleus.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><line x1=%2210%22 y1=%2250%22 x2=%2290%22 y2=%2250%22 stroke=%22%2300f0ff%22 stroke-width=%224%22/><line x1=%2270%22 y1=%2215.4%22 x2=%2230%22 y2=%2284.6%22 stroke=%22%2300f0ff%22 stroke-width=%224%22/><line x1=%2230%22 y1=%2215.4%22 x2=%2270%22 y2=%2284.6%22 stroke=%22%2300f0ff%22 stroke-width=%224%22/><line x1=%2212%22 y1=%2250%22 x2=%2292%22 y2=%2250%22 stroke=%22%23ff2ed1%22 stroke-width=%222%22 opacity=%220.55%22/><line x1=%2272%22 y1=%2215.4%22 x2=%2232%22 y2=%2284.6%22 stroke=%22%23ff2ed1%22 stroke-width=%222%22 opacity=%220.55%22/><line x1=%2232%22 y1=%2215.4%22 x2=%2272%22 y2=%2284.6%22 stroke=%22%23ff2ed1%22 stroke-width=%222%22 opacity=%220.55%22/></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'JetBrains Mono', monospace; cursor: crosshair; }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% -10%, rgba(0,240,255,0.10), transparent 55%),
                radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.65) 100%);
  }

  .hud {
    position: fixed;
    z-index: 5;
    color: #d7cfff;
    text-shadow: 0 0 8px rgba(0,240,255,0.45);
    user-select: none;
    pointer-events: none;
  }
  .title { top: 28px; left: 28px; font-size: clamp(16px, 3vw, 22px); font-weight: 700; letter-spacing: -0.01em; }
  .title span { color: #ff2ed1; text-shadow: 0 0 10px rgba(255,46,209,0.7); }
  .desc { top: 60px; left: 29px; font-size: 11px; letter-spacing: 0.06em; color: #786c99; text-shadow: none; max-width: 42ch; }
  .back { bottom: 28px; left: 28px; font-size: 11px; pointer-events: auto; }
  .back a { color: #00f0ff; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .hint { bottom: 28px; right: 28px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #786c99; text-align: right; text-shadow: none; }
  .params { top: 28px; right: 28px; font-size: 10px; letter-spacing: 0.04em; color: #4d4466; text-align: right; text-shadow: none; white-space: pre; }
  @media (max-width: 560px) { .hint { display: none; } .desc { max-width: 68vw; } }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="vignette"></div>

<div class="hud title">frost <span>//</span> midnightbandy</div>
<div class="hud desc">diffusion-limited aggregation: motes drift in off the edges on a random walk, and freeze the instant they touch the lattice. nobody drew the branches — the walk did.</div>
<div class="hud back"><a href="../index.html">← midnightbandy</a></div>
<div class="hud hint">move — blow the wind · click — seed a nucleus</div>
<div class="hud params" id="params"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const paramsEl = document.getElementById('params');

  // =====================================================================
  // pure math: grid + random-walk DLA, no DOM/canvas references below
  // this line until the render section. Verified standalone in Node:
  // determinism under a fixed seed, coordinates always in-bounds, no NaN,
  // stuckCount strictly increasing and bounded by cols*rows.
  // =====================================================================

  // deterministic seeded PRNG (mulberry32), returns a function yielding [0,1)
  function makeRng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeGrid(cols, rows) {
    return {
      cols, rows,
      occupied: new Uint8Array(cols * rows),
      order: new Int32Array(cols * rows).fill(-1),
      stuckCount: 0,
    };
  }
  function cellIndex(grid, gx, gy) { return gy * grid.cols + gx; }
  function inBounds(grid, gx, gy) { return gx >= 0 && gy >= 0 && gx < grid.cols && gy < grid.rows; }
  function isOccupied(grid, gx, gy) {
    return inBounds(grid, gx, gy) && grid.occupied[cellIndex(grid, gx, gy)] === 1;
  }
  function hasOccupiedNeighbor(grid, gx, gy) {
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        if (isOccupied(grid, gx + dx, gy + dy)) return true;
      }
    }
    return false;
  }
  // returns the stick order assigned, or -1 if the cell was already occupied
  function stickCell(grid, gx, gy) {
    if (!inBounds(grid, gx, gy)) return -1;
    const i = cellIndex(grid, gx, gy);
    if (grid.occupied[i] === 1) return -1;
    grid.occupied[i] = 1;
    const order = grid.stuckCount++;
    grid.order[i] = order;
    return order;
  }

  function spawnAtEdge(rng, cols, rows) {
    const side = Math.floor(rng() * 4);
    if (side === 0) return { x: rng() * (cols - 1), y: 0 };
    if (side === 1) return { x: rng() * (cols - 1), y: rows - 1 };
    if (side === 2) return { x: 0, y: rng() * (rows - 1) };
    return { x: cols - 1, y: rng() * (rows - 1) };
  }

  // one unit-length off-lattice step, optionally drifted toward (biasX,biasY)
  function stepWalker(w, rng, biasX, biasY, biasStrength) {
    const a = rng() * Math.PI * 2;
    let dx = Math.cos(a), dy = Math.sin(a);
    if (biasStrength > 0) {
      dx += biasX * biasStrength;
      dy += biasY * biasStrength;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
    }
    w.x += dx;
    w.y += dy;
  }

  function buildSim(cols, rows, rng, numSeeds) {
    const grid = makeGrid(cols, rows);
    for (let i = 0; i < numSeeds; i++) {
      const gx = Math.floor(rng() * cols);
      const gy = Math.floor(rng() * rows);
      stickCell(grid, gx, gy);
    }
    const WALKER_COUNT = Math.max(120, Math.min(600, Math.round((cols * rows) / 500)));
    const walkers = [];
    for (let i = 0; i < WALKER_COUNT; i++) walkers.push(spawnAtEdge(rng, cols, rows));
    return { grid, walkers, cols, rows };
  }

  // advances every walker by one micro-step (up to stepsPerTick of them),
  // sticking on contact and respawning on sticking or leaving the grid.
  // returns the list of {gx,gy,order} cells that froze this tick.
  function advanceSim(sim, rng, biasX, biasY, biasStrength, stepsPerTick) {
    const { grid, walkers, cols, rows } = sim;
    const frozen = [];
    for (let i = 0; i < walkers.length; i++) {
      const w = walkers[i];
      for (let s = 0; s < stepsPerTick; s++) {
        stepWalker(w, rng, biasX, biasY, biasStrength);
        const gx = Math.round(w.x), gy = Math.round(w.y);
        if (!inBounds(grid, gx, gy)) {
          const p = spawnAtEdge(rng, cols, rows);
          w.x = p.x; w.y = p.y;
          continue;
        }
        if (hasOccupiedNeighbor(grid, gx, gy)) {
          const order = stickCell(grid, gx, gy);
          if (order >= 0) frozen.push({ gx, gy, order });
          const p = spawnAtEdge(rng, cols, rows);
          w.x = p.x; w.y = p.y;
          break;
        }
      }
    }
    return frozen;
  }

  // =====================================================================
  // render: canvas-dependent from here on
  // =====================================================================

  const CELL = 3;
  let W = 0, H = 0, cols = 0, rows = 0;
  let sim = null, crystalCanvas = null, crystalCtx = null;
  let rng = makeRng((Math.random() * 1e9) | 0);
  let maxStuck = 1;
  let freshGlow = [];
  let windX = 0, windY = 0, targetWindX = 0, targetWindY = 0;
  let blooming = false, bloomStart = 0;
  const BLOOM_MS = 1400;

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const PALETTE = ['#7b2ff7', '#00f0ff', '#ff2ed1'].map(hexToRgb);
  function colorForOrder(order) {
    const t = Math.max(0, Math.min(1, order / maxStuck)) * (PALETTE.length - 1);
    const i0 = Math.floor(t);
    const i1 = Math.min(i0 + 1, PALETTE.length - 1);
    const lt = t - i0;
    const a = PALETTE[i0], b = PALETTE[i1];
    return [
      a[0] + (b[0] - a[0]) * lt,
      a[1] + (b[1] - a[1]) * lt,
      a[2] + (b[2] - a[2]) * lt,
    ];
  }

  function freezeCell(gx, gy, order) {
    const [r, g, b] = colorForOrder(order);
    crystalCtx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
    crystalCtx.fillRect(gx * CELL, gy * CELL, CELL, CELL);
    freshGlow.push({ gx, gy, r, g, b, t0: performance.now() });
  }

  function reset() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cols = Math.max(40, Math.round(W / CELL));
    rows = Math.max(30, Math.round(H / CELL));
    const numSeeds = 4 + Math.floor(rng() * 3);
    sim = buildSim(cols, rows, rng, numSeeds);
    maxStuck = Math.max(2000, Math.min(40000, Math.round(cols * rows * 0.11)));
    freshGlow = [];
    blooming = false;

    if (!crystalCanvas) crystalCanvas = document.createElement('canvas');
    crystalCanvas.width = cols * CELL;
    crystalCanvas.height = rows * CELL;
    crystalCtx = crystalCanvas.getContext('2d');
    crystalCtx.clearRect(0, 0, crystalCanvas.width, crystalCanvas.height);

    for (let i = 0; i < sim.grid.occupied.length; i++) {
      if (sim.grid.occupied[i] === 1) {
        freezeCell(i % cols, Math.floor(i / cols), sim.grid.order[i]);
      }
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (blooming) return;
    const gx = Math.round(e.clientX / CELL);
    const gy = Math.round(e.clientY / CELL);
    const order = stickCell(sim.grid, gx, gy);
    if (order >= 0) freezeCell(gx, gy, order);
  });
  window.addEventListener('pointermove', (e) => {
    const dx = e.clientX - W / 2, dy = e.clientY - H / 2;
    const len = Math.hypot(dx, dy) || 1;
    targetWindX = dx / len;
    targetWindY = dy / len;
  });
  window.addEventListener('resize', reset);
  reset();

  function frame() {
    const now = performance.now();
    windX += (targetWindX - windX) * 0.03;
    windY += (targetWindY - windY) * 0.03;

    if (blooming) {
      const t = (now - bloomStart) / BLOOM_MS;
      if (t >= 1) { reset(); }
    } else if (sim.grid.stuckCount >= maxStuck) {
      blooming = true;
      bloomStart = now;
    } else {
      const frozen = advanceSim(sim, rng, windX, windY, 0.22, 2);
      for (const f of frozen) freezeCell(f.gx, f.gy, f.order);
    }

    ctx.fillStyle = '#030108';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(crystalCanvas, 0, 0, W, H);

    // walkers: faint drifting motes seeking the lattice
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(0,240,255,0.55)';
    for (const w of sim.walkers) {
      ctx.beginPath();
      ctx.arc(w.x * CELL, w.y * CELL, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // fresh-growth glow: newly frozen cells flash bright, then fade and
    // leave only the dimmer permanent color already baked into the layer
    freshGlow = freshGlow.filter((g) => now - g.t0 < 550);
    for (const g of freshGlow) {
      const fade = 1 - (now - g.t0) / 550;
      ctx.fillStyle = `rgba(${g.r | 0},${g.g | 0},${g.b | 0},${0.9 * fade})`;
      ctx.shadowColor = `rgb(${g.r | 0},${g.g | 0},${g.b | 0})`;
      ctx.shadowBlur = 10 * fade;
      ctx.beginPath();
      ctx.arc(g.gx * CELL, g.gy * CELL, CELL * 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';

    if (blooming) {
      const t = (now - bloomStart) / BLOOM_MS;
      ctx.fillStyle = `rgba(3,1,8,${Math.min(1, t)})`;
      ctx.fillRect(0, 0, W, H);
    }

    paramsEl.textContent =
      'frozen ' + sim.grid.stuckCount + ' / ' + maxStuck + '\n' +
      'wind ' + windX.toFixed(2) + ',' + windY.toFixed(2);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>

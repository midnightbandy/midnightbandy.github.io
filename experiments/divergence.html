<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>divergence — midnightbandy</title>
<meta name="description" content="nine double pendulums, hand-rolled RK4, nearly identical starts. watch them disagree. move to tilt gravity, tap to reset.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><circle cx=%2250%22 cy=%2212%22 r=%223%22 fill=%22%23786c99%22/><path d=%22M50 12 L30 46 L60 80%22 stroke=%22%2300f0ff%22 stroke-width=%223%22 fill=%22none%22/><path d=%22M50 12 L62 48 L36 78%22 stroke=%22%23ff2ed1%22 stroke-width=%223%22 fill=%22none%22/></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'JetBrains Mono', monospace; cursor: crosshair; }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
  }

  .hud {
    position: fixed;
    z-index: 5;
    color: #d7cfff;
    text-shadow: 0 0 8px rgba(0,240,255,0.45);
    user-select: none;
    pointer-events: none;
  }
  .title { top: 28px; left: 28px; font-size: clamp(16px, 3vw, 22px); font-weight: 700; letter-spacing: -0.01em; }
  .title span { color: #ff2ed1; text-shadow: 0 0 10px rgba(255,46,209,0.7); }
  .desc { top: 60px; left: 29px; font-size: 11px; letter-spacing: 0.06em; color: #786c99; text-shadow: none; max-width: 42ch; }
  .back { bottom: 28px; left: 28px; font-size: 11px; pointer-events: auto; }
  .back a { color: #00f0ff; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .hint { bottom: 28px; right: 28px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #786c99; text-align: right; text-shadow: none; }
  .params { top: 28px; right: 28px; font-size: 10px; letter-spacing: 0.04em; color: #4d4466; text-align: right; text-shadow: none; white-space: pre; }
  @media (max-width: 560px) { .hint { display: none; } .desc { max-width: 68vw; } }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="vignette"></div>

<div class="hud title">double pendulum <span>//</span> divergence</div>
<div class="hud desc">nine arms, dropped within a hundredth of a radian of each other. same gravity, same math, same start. they stop agreeing within seconds.</div>
<div class="hud back"><a href="../index.html">← midnightbandy</a></div>
<div class="hud hint">move to tilt gravity · tap / click / r — redrop</div>
<div class="hud params" id="params"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const paramsEl = document.getElementById('params');

  let W = 0, H = 0, pivotX = 0, pivotY = 0, scalePx = 1;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    pivotX = W * 0.5;
    pivotY = H * 0.32;
    scalePx = Math.min(W, H) * 0.24;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- physics: standard double pendulum, RK4, lengths/masses = 1 ----------
  const G = 9.81;
  const L1 = 1, L2 = 1, M1 = 1, M2 = 1;
  const SUBSTEP_DT = 1 / 240;
  const MAX_SUBSTEPS = 8;

  function derivs(a1, a2, w1, w2, phi) {
    const da = a1 - a2;
    const den = 2 * M1 + M2 - M2 * Math.cos(2 * da);
    const c1 = a1 - phi;

    const num1 = -G * (2 * M1 + M2) * Math.sin(c1)
      - M2 * G * Math.sin(a1 - 2 * a2 + phi)
      - 2 * Math.sin(da) * M2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(da));
    const aa1 = num1 / (L1 * den);

    const num2 = 2 * Math.sin(da) * (
      w1 * w1 * L1 * (M1 + M2)
      + G * (M1 + M2) * Math.cos(c1)
      + w2 * w2 * L2 * M2 * Math.cos(da)
    );
    const aa2 = num2 / (L2 * den);

    return [w1, w2, aa1, aa2];
  }

  function rk4(p, dt, phi) {
    const s0 = [p.a1, p.a2, p.w1, p.w2];
    const k1 = derivs(s0[0], s0[1], s0[2], s0[3], phi);
    const s1 = s0.map((v, i) => v + k1[i] * dt / 2);
    const k2 = derivs(s1[0], s1[1], s1[2], s1[3], phi);
    const s2 = s0.map((v, i) => v + k2[i] * dt / 2);
    const k3 = derivs(s2[0], s2[1], s2[2], s2[3], phi);
    const s3 = s0.map((v, i) => v + k3[i] * dt);
    const k4 = derivs(s3[0], s3[1], s3[2], s3[3], phi);
    p.a1 = s0[0] + (dt / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
    p.a2 = s0[1] + (dt / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
    p.w1 = s0[2] + (dt / 6) * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
    p.w2 = s0[3] + (dt / 6) * (k1[3] + 2 * k2[3] + 2 * k3[3] + k4[3]);
  }

  const PALETTE = ['#00f0ff', '#39d6ff', '#7b2ff7', '#b18cff', '#ff2ed1', '#ff6fd8', '#00ffa3', '#61e8c8', '#ffb454'];
  const N = PALETTE.length;
  const EPS = 0.004; // per-arm angular offset at drop; small enough to look identical, large enough to split apart in a few seconds

  let pendulums = [];

  function rand(min, max) { return min + Math.random() * (max - min); }

  function reset() {
    const baseA1 = rand(0.8, 2.6) * (Math.random() < 0.5 ? 1 : -1);
    const baseA2 = rand(-2.6, 2.6);
    pendulums = [];
    for (let i = 0; i < N; i++) {
      const off = (i - (N - 1) / 2) * EPS;
      pendulums.push({
        a1: baseA1 + off, a2: baseA2 - off, w1: 0, w2: 0,
        color: PALETTE[i],
        px: null, py: null, // previous bob2 screen position, for trail segments
      });
    }
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- pointer: continuous move tilts gravity, a quick tap/click redrops ----------
  let phiTarget = 0, phi = 0;
  const MAX_TILT = 25 * Math.PI / 180;
  let downAt = 0, downX = 0, downY = 0;

  canvas.addEventListener('pointermove', (e) => {
    phiTarget = ((e.clientX / window.innerWidth) - 0.5) * 2 * MAX_TILT;
  });
  canvas.addEventListener('pointerdown', (e) => {
    downAt = performance.now();
    downX = e.clientX; downY = e.clientY;
  });
  canvas.addEventListener('pointerup', (e) => {
    const dt = performance.now() - downAt;
    const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
    if (dt < 300 && dist < 8) reset();
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') reset();
  });
  window.addEventListener('resize', resize);

  resize();
  reset();

  // ---------- main loop ----------
  let lastT = performance.now();
  let lastParamUpdate = 0;
  let spreadSmoothed = 0;

  function frame(now) {
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.1) dt = 0.1; // clamp after a tab-switch stall
    phi += (phiTarget - phi) * 0.05;

    let steps = Math.min(MAX_SUBSTEPS, Math.max(1, Math.round(dt / SUBSTEP_DT)));
    for (let s = 0; s < steps; s++) {
      for (const p of pendulums) rk4(p, SUBSTEP_DT, phi);
    }

    // fade the previous frame instead of clearing, so bob trails linger as light
    ctx.fillStyle = 'rgba(0,0,2,0.085)';
    ctx.fillRect(0, 0, W, H);

    ctx.lineCap = 'round';
    let maxSpread = 0;
    const lead = pendulums[0];
    const tail = pendulums[N - 1];

    for (const p of pendulums) {
      const x1 = pivotX + Math.sin(p.a1) * L1 * scalePx;
      const y1 = pivotY + Math.cos(p.a1) * L1 * scalePx;
      const x2 = x1 + Math.sin(p.a2) * L2 * scalePx;
      const y2 = y1 + Math.cos(p.a2) * L2 * scalePx;

      if (p.px !== null) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      p.px = x2; p.py = y2;

      // arms, drawn faint, reset to normal blending so they don't over-brighten
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pivotX, pivotY);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      p._bx = x2; p._by = y2;
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // pivot, drawn last so it stays crisp above the trails
    ctx.fillStyle = '#786c99';
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, 3, 0, Math.PI * 2);
    ctx.fill();

    const spread = Math.hypot(lead._bx - tail._bx, lead._by - tail._by) / scalePx;
    spreadSmoothed += (spread - spreadSmoothed) * 0.05;

    if (now - lastParamUpdate > 150) {
      lastParamUpdate = now;
      paramsEl.textContent =
        'tilt  ' + (phi * 180 / Math.PI).toFixed(1).padStart(6) + '°\n' +
        'split ' + spreadSmoothed.toFixed(3).padStart(6);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
